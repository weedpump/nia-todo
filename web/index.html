<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nia-todo</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <span class="logo-icon">✨</span>
        <span class="logo-text">nia-todo</span>
      </div>

      <nav class="nav-section">
        <div class="nav-title">Ansicht</div>
        <button class="nav-btn active" data-filter="all" onclick="setFilter('all')">
          <span>📋</span> Alle
          <span class="badge" id="count-all">0</span>
        </button>
        <button class="nav-btn" data-filter="pending" onclick="setFilter('pending')">
          <span>⏳</span> Offen
          <span class="badge" id="count-pending">0</span>
        </button>
        <button class="nav-btn" data-filter="in_progress" onclick="setFilter('in_progress')">
          <span>🔥</span> In Arbeit
          <span class="badge" id="count-in_progress">0</span>
        </button>
        <button class="nav-btn" data-filter="done" onclick="setFilter('done')">
          <span>✅</span> Erledigt
          <span class="badge" id="count-done">0</span>
        </button>
      </nav>

      <nav class="nav-section">
        <div class="nav-title">Projekte</div>
        <div id="project-list"></div>
        <button class="nav-btn add-btn" onclick="showProjectModal()">
          <span>➕</span> Projekt hinzufügen
        </button>
      </nav>

      <nav class="nav-section">
        <div class="nav-title">Labels</div>
        <div id="label-list"></div>
        <button class="nav-btn add-btn" onclick="showLabelModal()">
          <span>🏷️</span> Label erstellen
        </button>
      </nav>
    </aside>

    <!-- Main -->
    <main class="main">
      <!-- Top bar -->
      <div class="topbar">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="🔍 Todo suchen..." oninput="renderTodos()">
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary" onclick="showTodoModal()">
            <span>➕</span> Neues Todo
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-bar" id="stats-bar"></div>

      <!-- Todos -->
      <div class="todo-list" id="todo-list"></div>
    </main>
  </div>

  <!-- Todo Modal -->
  <div class="modal" id="todo-modal">
    <div class="modal-overlay" onclick="closeModal('todo-modal')"></div>
    <div class="modal-content">
      <h3 id="todo-modal-title">Neues Todo</h3>
      <button class="modal-close-x" onclick="closeModal('todo-modal')">✕</button>
      <form id="todo-form" onsubmit="saveTodo(event)">
        <input type="hidden" id="todo-id">
        <div class="form-group">
          <label>Titel</label>
          <input type="text" id="todo-title" required placeholder="Was ist zu tun?">
        </div>
        <div class="form-group">
          <label>Beschreibung</label>
          <textarea id="todo-desc" rows="3" placeholder="Details..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Priorität</label>
            <select id="todo-priority">
              <option value="1">🔴 Sehr hoch</option>
              <option value="2">🟡 Hoch</option>
              <option value="3" selected>🟢 Mittel</option>
              <option value="4">⚪ Niedrig</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="todo-status">
              <option value="pending">⏳ Offen</option>
              <option value="in_progress">🔥 In Arbeit</option>
              <option value="done">✅ Erledigt</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Projekt</label>
            <select id="todo-project"></select>
          </div>
          <div class="form-group">
            <label>Deadline</label>
            <input type="datetime-local" id="todo-due">
          </div>
        </div>
        <div class="form-group">
          <label>Erinnerung</label>
          <input type="datetime-local" id="todo-remind">
        </div>
        <div class="form-group">
          <label>Labels</label>
          <div id="todo-labels" class="label-picker"></div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('todo-modal')">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="project-modal">
    <div class="modal-overlay" onclick="closeModal('project-modal')"></div>
    <div class="modal-content">
      <h3 id="project-modal-title">Neues Projekt</h3>
      <button class="modal-close-x" onclick="closeModal('project-modal')">✕</button>
      <form id="project-form" onsubmit="saveProject(event)">
        <input type="hidden" id="project-id">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="project-name" required>
        </div>
        <div class="form-group">
          <label>Farbe</label>
          <input type="color" id="project-color" value="#6366f1">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="project-delete-btn" onclick="deleteProjectFromModal()" style="margin-right:auto;display:none;">🗑️ Löschen</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('project-modal')">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Label Modal -->
  <div class="modal" id="label-modal">
    <div class="modal-overlay" onclick="closeModal('label-modal')"></div>
    <div class="modal-content">
      <h3 id="label-modal-title">Neues Label</h3>
      <button class="modal-close-x" onclick="closeModal('label-modal')">✕</button>
      <form id="label-form" onsubmit="saveLabel(event)">
        <input type="hidden" id="label-id">
        <input type="hidden" id="label-id">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="label-name" required>
        </div>
        <div class="form-group">
          <label>Farbe</label>
          <input type="color" id="label-color" value="#8b5cf6">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-danger" id="label-delete-btn" onclick="deleteLabelFromModal()" style="margin-right:auto;display:none;">🗑️ Löschen</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal('label-modal')">Abbrechen</button>
          <button type="submit" class="btn btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
