name: Tests

# Runs on PRs, pushes to main, and manual dispatch. Builds a real server .deb
# (no native apps embedded - --allow-missing-apps keeps this fast) and
# installs it exactly as a self-hoster would (systemd service, /opt/nia-todo,
# /var/lib/nia-todo), so tests run against the real package instead of a
# synthetic dev-only environment. release.yml runs the same test suite
# separately against the actual release .deb via install-and-test.sh.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r packaging/requirements.txt httpx2==2.16.0

      - name: Install frontend/native toolchain dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build test package (no native apps embedded)
        run: |
          scripts/release/build-full-bundle.sh 0.0.0 \
            --allow-missing-apps \
            --output-dir dist/release/ci \
            --force

      - name: Install package and run test suite
        env:
          MOBILE_SWIPE_BROWSERS: chromium
        run: scripts/release/install-and-test.sh dist/release/ci/nia-todo-server-v0.0.0-full.deb

  webkit-swipe:
    runs-on: ubuntu-26.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-resolute@sha256:5804dd8c666684ea858091d52c91ef97974caa999b25f0f03efa485d9ffeb434
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run WebKit mobile swipe regression
        env:
          MOBILE_SWIPE_BROWSERS: webkit
        run: node scripts/test_mobile_swipe_underlay.mjs
