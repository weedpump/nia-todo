name: CI

# Automatic: tests only, on PRs and merges to main.
# Builds (Docker/Windows/Android/Debian) are never automatic here -
# only via manual dispatch, or via the tag-triggered release workflow.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_docker:
        description: "Build the Docker image (health check; opt in push_docker to also push it)"
        type: boolean
        default: false
      push_docker:
        description: "Push the built Docker image to GHCR as :dev-<sha>"
        type: boolean
        default: false
      build_native:
        description: "Also build Windows/Android/Debian native apps (slow, uses a dev-signed Android key)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r packaging/requirements.txt

      - name: Install frontend/native toolchain dependencies
        run: npm ci

      - name: Run test suite
        run: ./scripts/test_all.sh

  build:
    if: github.event_name == 'workflow_dispatch' && (inputs.build_docker || inputs.build_native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r packaging/requirements.txt

      - name: Install frontend/native toolchain dependencies
        run: npm ci

      - name: Build Docker image
        if: inputs.build_docker
        run: |
          scripts/release/build-docker.sh 0.0.0 \
            --allow-missing-apps \
            --tag "nia-todo:ci-check" \
            --output "dist/docker/ci-${{ github.sha }}" \
            --force

      - name: Push Docker image to GHCR
        if: inputs.build_docker && inputs.push_docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "nia-todo:ci-check" "ghcr.io/${{ github.repository_owner }}/nia-todo:dev-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository_owner }}/nia-todo:dev-${{ github.sha }}"

      - name: Install Tauri Linux build dependencies
        if: inputs.build_native
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.build_native

      - name: Install cargo-xwin (Windows cross-compile)
        if: inputs.build_native
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo install cargo-xwin

      - name: Build Windows installer (unsigned dev build)
        if: inputs.build_native
        run: |
          python3 scripts/prepare_tauri_frontend_dist.py
          npm run tauri -- build --target x86_64-pc-windows-msvc --runner cargo-xwin
        continue-on-error: true

      - name: Set up Android SDK/NDK
        if: inputs.build_native
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build-tools
        if: inputs.build_native
        run: sdkmanager --install "ndk;27.0.12077973" "build-tools;35.0.0"

      - name: Build Android APK (dev-signed, not the release key)
        if: inputs.build_native
        run: |
          python3 scripts/prepare_tauri_frontend_dist.py
          npm run tauri -- android build --target aarch64 --apk --ci
        continue-on-error: true

      - name: Build Debian desktop package
        if: inputs.build_native
        run: |
          python3 scripts/prepare_tauri_frontend_dist.py
          npm run tauri -- build --bundles deb
        continue-on-error: true

      - name: Upload native dev artifacts
        if: inputs.build_native
        uses: actions/upload-artifact@v4
        with:
          name: native-dev-${{ github.sha }}
          retention-days: 7
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
