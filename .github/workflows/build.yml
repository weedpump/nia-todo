name: Build

# Single source of truth for building Windows/Android/Debian-desktop/Docker/
# server-.deb. Used two ways:
#   - manual workflow_dispatch: ad-hoc test builds, one or more packages at a
#     time, "version" left empty (dev/test naming, falls back to the latest
#     published release for whichever native apps weren't freshly built).
#   - workflow_call from release.yml: all five always true, "version" set to
#     the real release version (no fallback - everything is built fresh).
on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows installer"
        type: boolean
        default: false
      build_android:
        description: "Build Android APK"
        type: boolean
        default: false
      build_debian_desktop:
        description: "Build Debian desktop .deb"
        type: boolean
        default: false
      build_docker:
        description: "Build Docker image (embeds native apps: freshly built ones above if selected, otherwise the latest published GitHub release's apps)"
        type: boolean
        default: false
      build_server_deb:
        description: "Build the full server .deb installer (same embedding rule as Docker)"
        type: boolean
        default: false
      push_docker:
        description: "Push the built Docker image to GHCR and Docker Hub as :dev-<sha>"
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_windows:
        type: boolean
        default: false
      build_android:
        type: boolean
        default: false
      build_debian_desktop:
        type: boolean
        default: false
      build_docker:
        type: boolean
        default: false
      build_server_deb:
        type: boolean
        default: false
      push_docker:
        type: boolean
        default: false
      version:
        description: "Real release version (X.Y.Z). Empty means an ad-hoc dev/test build."
        type: string
        default: ""
      ref:
        description: "Git ref to build (defaults to whatever triggered this workflow). release.yml passes the post-version-bump main commit explicitly, since checking out the default ref would build the pre-bump code."
        type: string
        default: ""

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ inputs.version == '' }}

permissions:
  contents: read
  packages: write

jobs:
  build-windows:
    if: inputs.build_windows
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm lld libayatana-appindicator3-dev nsis
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with: { targets: x86_64-pc-windows-msvc }
      - run: |
          rustup target add x86_64-pc-windows-msvc
          cargo install cargo-xwin --locked
      - run: python3 scripts/prepare_tauri_frontend_dist.py
      - name: Build signed Windows installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --runner cargo-xwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Rename to a fixed artifact name
        run: |
          mkdir -p dist/ci-windows
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe dist/ci-windows/nia-todo-ci-windows-x64-setup.exe
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig dist/ci-windows/nia-todo-ci-windows-x64-setup.exe.sig
      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: nia-todo-ci-windows-x64-setup.exe
          retention-days: 7
          if-no-files-found: error
          path: dist/ci-windows/nia-todo-ci-windows-x64-setup.exe
          archive: false
      - name: Upload Windows updater signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: nia-todo-ci-windows-x64-setup.exe.sig
          retention-days: 7
          if-no-files-found: error
          path: dist/ci-windows/nia-todo-ci-windows-x64-setup.exe.sig
          archive: false

  build-android:
    if: inputs.build_android
    runs-on: ubuntu-26.04
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6
        with: { distribution: "temurin", java-version: "21" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version: "22", cache: "npm" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.13" }
      - run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - name: Patch Tauri Android Gradle compatibility
        run: python3 scripts/patch_tauri_android_gradle.py
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          accept-android-sdk-licenses: false
          packages: ""
      - name: Install Android CLI
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
            | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] https://dl.google.com/android/cli/latest/debian/ stable main" \
            | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli
      - name: Install Android SDK packages
        run: |
          android --no-metrics --sdk="${ANDROID_HOME}" sdk install platform-tools
          android --no-metrics --sdk="${ANDROID_HOME}" sdk install platforms/android-37.0
          android --no-metrics --sdk="${ANDROID_HOME}" sdk install ndk/27.0.12077973
          android --no-metrics --sdk="${ANDROID_HOME}" sdk install build-tools/35.0.0
      - name: Restore Android release keystore
        run: |
          mkdir -p secrets
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > secrets/nia-todo-android-release.keystore
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_PASS }}" > secrets/nia-todo-android-release.pass
      - run: python3 scripts/prepare_tauri_frontend_dist.py
      - name: Set generated Android version (release builds only)
        if: inputs.version != ''
        run: |
          MAJOR=$(echo "${{ inputs.version }}" | cut -d. -f1)
          MINOR=$(echo "${{ inputs.version }}" | cut -d. -f2)
          PATCH=$(echo "${{ inputs.version }}" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          mkdir -p src-tauri/gen/android/app/src/main/assets
          cat > src-tauri/gen/android/app/tauri.properties <<EOF
          # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          tauri.android.versionName=${{ inputs.version }}
          tauri.android.versionCode=${VERSION_CODE}
          EOF
          cp src-tauri/tauri.conf.json src-tauri/gen/android/app/src/main/assets/tauri.conf.json
      - name: Build Android APK
        run: npm run tauri -- android build --target aarch64 --apk --ci
      - name: Verify generated Android version (release builds only)
        if: inputs.version != ''
        run: grep -Fq "tauri.android.versionName=${{ inputs.version }}" src-tauri/gen/android/app/tauri.properties
      - name: Align and sign APK
        env:
          NIA_TODO_SECRETS_DIR: ${{ github.workspace }}/secrets
        run: |
          BUILT_APK="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          ALIGNED_APK="/tmp/nia-todo-ci-android-arm64-aligned.apk"
          "${ANDROID_HOME}/build-tools/35.0.0/zipalign" -p -f 4 "${BUILT_APK}" "${ALIGNED_APK}"
          mkdir -p dist/ci-android
          export ANDROID_KEYSTORE_PASS=$(tr -d '\r\n' < secrets/nia-todo-android-release.pass)
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks secrets/nia-todo-android-release.keystore \
            --ks-key-alias nia-todo-android-release \
            --ks-pass env:ANDROID_KEYSTORE_PASS --key-pass env:ANDROID_KEYSTORE_PASS \
            --out dist/ci-android/nia-todo-android-arm64.apk "${ALIGNED_APK}"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            dist/ci-android/nia-todo-android-arm64.apk
          unset ANDROID_KEYSTORE_PASS
      - if: always()
        run: rm -rf secrets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          retention-days: 7
          if-no-files-found: error
          path: dist/ci-android/nia-todo-android-arm64.apk
          archive: false

  build-debian-desktop:
    if: inputs.build_debian_desktop
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version: "22", cache: "npm" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.13" }
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            build-essential curl wget file libssl-dev libgtk-3-dev librsvg2-dev dpkg-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - run: python3 scripts/prepare_tauri_frontend_dist.py
      - name: Build restricted Debian updater
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --bin nia-todo-desktop-updater
      - run: npm run tauri -- build --bundles deb
      - name: Repack with the correct package name
        run: |
          mkdir -p dist/ci-debian-desktop
          scripts/release/repack-native-debian-deb.sh \
            src-tauri/target/release/bundle/deb/nia-todo_*_amd64.deb \
            dist/ci-debian-desktop/nia-todo-desktop-amd64.deb \
            src-tauri/target/release/nia-todo-desktop-updater
      - name: Sign final Debian package
        run: |
          DEB="dist/ci-debian-desktop/nia-todo-desktop-amd64.deb"
          DEB_VERSION="$(dpkg-deb -f "${DEB}" Version)"
          npm run tauri -- signer sign --app-version "${DEB_VERSION}" "${DEB}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: nia-todo-desktop-amd64.deb
          retention-days: 7
          if-no-files-found: error
          path: dist/ci-debian-desktop/nia-todo-desktop-amd64.deb
          archive: false
      - name: Upload Debian updater signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: nia-todo-desktop-amd64.deb.sig
          retention-days: 7
          if-no-files-found: error
          path: dist/ci-debian-desktop/nia-todo-desktop-amd64.deb.sig
          archive: false

  # Docker/server-.deb always embed native apps: freshly built ones from the
  # jobs above if selected, otherwise (dev/test builds only) the latest
  # published GitHub release's apps. There is no "no apps embedded" mode.
  # Release builds (version set) always have all three built fresh above.
  package:
    if: |
      always() &&
      (inputs.build_docker || inputs.build_server_deb)
    needs: [build-windows, build-android, build-debian-desktop]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with: { python-version: "3.13" }

      - name: Download freshly built native artifacts (if any were built)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist/ci-native
          pattern: nia-todo-*
          merge-multiple: true
        continue-on-error: true

      - name: Collect native apps for embedding
        id: apps
        run: |
          mkdir -p dist/native-embed
          have_windows=0; have_android=0; have_debian=0
          [ "${{ needs.build-windows.result }}" = "success" ] && cp dist/ci-native/nia-todo-ci-windows-x64-setup.exe dist/native-embed/ && have_windows=1
          [ -f dist/ci-native/nia-todo-ci-windows-x64-setup.exe.sig ] && cp dist/ci-native/nia-todo-ci-windows-x64-setup.exe.sig dist/native-embed/ || true
          [ "${{ needs.build-android.result }}" = "success" ] && cp dist/ci-native/nia-todo-android-arm64.apk dist/native-embed/nia-todo-ci-android-arm64.apk && have_android=1
          [ "${{ needs.build-debian-desktop.result }}" = "success" ] && cp dist/ci-native/nia-todo-desktop-amd64.deb dist/native-embed/nia-todo-ci-debian-amd64.deb && have_debian=1
          [ -f dist/ci-native/nia-todo-desktop-amd64.deb.sig ] && cp dist/ci-native/nia-todo-desktop-amd64.deb.sig dist/native-embed/nia-todo-ci-debian-amd64.deb.sig || true

          if [ -n "${{ inputs.version }}" ]; then
            # Release build: all three are always built fresh above, never fall back.
            echo "source=release" >> "$GITHUB_OUTPUT"
            echo "native_app_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Fill only the apps that weren't freshly built this run - never
            # discard a fresh build just because another one wasn't selected.
            if [ "${have_windows}" = "0" ] || [ "${have_android}" = "0" ] || [ "${have_debian}" = "0" ]; then
              echo "Fetching the latest published release's apps to fill in what wasn't freshly built..."
              scripts/release/fetch-latest-native-artifacts.sh \
                --github-repo "${{ github.repository }}" \
                --output-dir dist/native-fallback
              source dist/native-fallback/native-app-version.env
              [ "${have_windows}" = "1" ] || cp dist/native-fallback/nia-todo-ci-windows-x64-setup.exe dist/native-embed/
              if [ "${have_windows}" = "0" ] && [ -f dist/native-fallback/nia-todo-ci-windows-x64-setup.exe.sig ]; then
                cp dist/native-fallback/nia-todo-ci-windows-x64-setup.exe.sig dist/native-embed/
              fi
              [ "${have_android}" = "1" ] || cp dist/native-fallback/nia-todo-ci-android-arm64.apk dist/native-embed/
              [ "${have_debian}" = "1" ] || cp dist/native-fallback/nia-todo-ci-debian-amd64.deb dist/native-embed/
              if [ "${have_debian}" = "0" ] && [ -f dist/native-fallback/nia-todo-ci-debian-amd64.deb.sig ]; then
                cp dist/native-fallback/nia-todo-ci-debian-amd64.deb.sig dist/native-embed/
              fi
            fi

            if [ "${have_windows}" = "1" ] && [ "${have_android}" = "1" ] && [ "${have_debian}" = "1" ]; then
              echo "source=fresh" >> "$GITHUB_OUTPUT"
              echo "native_app_version=0.0.0" >> "$GITHUB_OUTPUT"
            elif [ "${have_windows}" = "0" ] && [ "${have_android}" = "0" ] && [ "${have_debian}" = "0" ]; then
              echo "source=latest-release" >> "$GITHUB_OUTPUT"
              echo "native_app_version=${native_app_version}" >> "$GITHUB_OUTPUT"
            else
              echo "source=mixed" >> "$GITHUB_OUTPUT"
              echo "native_app_version=0.0.0" >> "$GITHUB_OUTPUT"
              echo "::warning::Embedding a mix of freshly built and last-release native apps; the manifest version number does not reflect this precisely - fine for an ad-hoc test build, not for a real release."
            fi
          fi

          if [ -n "${{ inputs.version }}" ]; then
            echo "windows_app_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${have_windows}" = "1" ]; then
            echo "windows_app_version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" >> "$GITHUB_OUTPUT"
          else
            echo "windows_app_version=${native_app_version}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.version }}" ]; then
            echo "android_app_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${have_android}" = "1" ]; then
            echo "android_app_version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')" >> "$GITHUB_OUTPUT"
          else
            echo "android_app_version=${native_app_version}" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${{ inputs.version }}" ]; then
            echo "debian_app_version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${have_debian}" = "1" ]; then
            echo "debian_app_version=$(dpkg-deb -f dist/native-embed/nia-todo-ci-debian-amd64.deb Version)" >> "$GITHUB_OUTPUT"
          else
            echo "debian_app_version=${native_app_version}" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with: { node-version: "22", cache: "npm" }
      - run: npm ci

      - name: Build Docker image
        if: inputs.build_docker
        run: |
          WINDOWS_SIGNATURE_ARGS=()
          DEBIAN_SIGNATURE_ARGS=()
          if [ -n "${{ inputs.version }}" ]; then
            WINDOWS_SIGNATURE_ARGS=(--windows-signature dist/native-embed/nia-todo-ci-windows-x64-setup.exe.sig --require-windows-signature)
            DEBIAN_SIGNATURE_ARGS=(--debian-signature dist/native-embed/nia-todo-ci-debian-amd64.deb.sig --require-debian-signature)
          elif [ -f dist/native-embed/nia-todo-ci-windows-x64-setup.exe.sig ]; then
            WINDOWS_SIGNATURE_ARGS=(--windows-signature dist/native-embed/nia-todo-ci-windows-x64-setup.exe.sig)
          fi
          if [ -z "${{ inputs.version }}" ] && [ -f dist/native-embed/nia-todo-ci-debian-amd64.deb.sig ]; then
            DEBIAN_SIGNATURE_ARGS=(--debian-signature dist/native-embed/nia-todo-ci-debian-amd64.deb.sig)
          fi
          scripts/release/build-docker.sh "${{ inputs.version || '0.0.0' }}" \
            --windows-installer dist/native-embed/nia-todo-ci-windows-x64-setup.exe \
            "${WINDOWS_SIGNATURE_ARGS[@]}" \
            --android-apk dist/native-embed/nia-todo-ci-android-arm64.apk \
            --debian-deb dist/native-embed/nia-todo-ci-debian-amd64.deb \
            "${DEBIAN_SIGNATURE_ARGS[@]}" \
            --native-app-version "${{ steps.apps.outputs.android_app_version }}" \
            --windows-version "${{ steps.apps.outputs.windows_app_version }}" \
            --debian-version "${{ steps.apps.outputs.debian_app_version }}" \
            --tag "${{ inputs.version && format('nia-todo:{0}', inputs.version) || 'nia-todo:ci-check' }}" \
            --output "dist/docker/build-${{ github.sha }}" \
            --force

      - name: Save release Docker image
        if: inputs.build_docker && inputs.version != ''
        run: |
          mkdir -p dist/docker/release
          docker save "nia-todo:${{ inputs.version }}" --output "dist/docker/release/nia-todo-v${{ inputs.version }}.tar"

      - name: Upload release Docker image
        if: inputs.build_docker && inputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: nia-todo-v${{ inputs.version }}.tar
          retention-days: 7
          if-no-files-found: error
          path: dist/docker/release/nia-todo-v${{ inputs.version }}.tar
          archive: false

      - name: Push dev/test Docker image to GHCR and Docker Hub
        if: inputs.build_docker && inputs.version == '' && inputs.push_docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "nia-todo:ci-check" "ghcr.io/${{ github.repository_owner }}/nia-todo:dev-${{ github.sha }}"
          docker push "ghcr.io/${{ github.repository_owner }}/nia-todo:dev-${{ github.sha }}"

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          docker tag "nia-todo:ci-check" "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nia-todo:dev-${{ github.sha }}"
          docker push "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/nia-todo:dev-${{ github.sha }}"

      - name: Build server .deb installer
        if: inputs.build_server_deb
        run: |
          WINDOWS_SIGNATURE_ARGS=()
          DEBIAN_SIGNATURE_ARGS=()
          if [ -n "${{ inputs.version }}" ]; then
            WINDOWS_SIGNATURE_ARGS=(--windows-signature dist/native-embed/nia-todo-ci-windows-x64-setup.exe.sig --require-windows-signature)
            DEBIAN_SIGNATURE_ARGS=(--debian-signature dist/native-embed/nia-todo-ci-debian-amd64.deb.sig --require-debian-signature)
          elif [ -f dist/native-embed/nia-todo-ci-windows-x64-setup.exe.sig ]; then
            WINDOWS_SIGNATURE_ARGS=(--windows-signature dist/native-embed/nia-todo-ci-windows-x64-setup.exe.sig)
          fi
          if [ -z "${{ inputs.version }}" ] && [ -f dist/native-embed/nia-todo-ci-debian-amd64.deb.sig ]; then
            DEBIAN_SIGNATURE_ARGS=(--debian-signature dist/native-embed/nia-todo-ci-debian-amd64.deb.sig)
          fi
          scripts/release/build-full-bundle.sh "${{ inputs.version || '0.0.0' }}" \
            --windows-installer dist/native-embed/nia-todo-ci-windows-x64-setup.exe \
            "${WINDOWS_SIGNATURE_ARGS[@]}" \
            --android-apk dist/native-embed/nia-todo-ci-android-arm64.apk \
            --debian-deb dist/native-embed/nia-todo-ci-debian-amd64.deb \
            "${DEBIAN_SIGNATURE_ARGS[@]}" \
            --native-app-version "${{ steps.apps.outputs.android_app_version }}" \
            --windows-version "${{ steps.apps.outputs.windows_app_version }}" \
            --debian-version "${{ steps.apps.outputs.debian_app_version }}" \
            --output-dir "dist/release/build-${{ github.sha }}" \
            --force

      - name: Upload server .deb installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: inputs.build_server_deb
        with:
          retention-days: 7
          if-no-files-found: error
          path: dist/release/build-${{ github.sha }}/*.deb
          archive: false

      - name: Upload server .deb checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: inputs.build_server_deb
        with:
          retention-days: 7
          if-no-files-found: error
          path: dist/release/build-${{ github.sha }}/*.deb.sha256
          archive: false
