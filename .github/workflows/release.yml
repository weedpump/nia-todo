name: Release

# Triggered by pushing a tag from main, e.g.:
#   git checkout main && git tag v2.7.0 && git push origin v2.7.0
# Orchestrates the shared tests.yml and build.yml workflows instead of
# duplicating their steps - this file only does what's release-specific:
# bumping the version, moving the tag onto the bump commit, creating the
# GitHub release, and bumping develop to the next -dev version.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  prepare-version:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump_commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version and switch to main
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag ${TAG} is not a plain vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          git checkout main
          if [ "$(git rev-parse main)" != "$(git rev-parse "${TAG}^{commit}")" ]; then
            echo "❌ Tag ${TAG} does not point at the tip of main"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare release version and move tag
        id: bump
        run: |
          scripts/release/prepare-release-version.sh "${{ steps.version.outputs.version }}"
          git tag -f "${{ steps.version.outputs.tag }}" HEAD
          git push origin main
          git push origin "${{ steps.version.outputs.tag }}" --force
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-version
    uses: ./.github/workflows/build.yml
    with:
      build_windows: true
      build_android: true
      build_debian_desktop: true
      build_docker: true
      build_server_deb: true
      version: ${{ needs.prepare-version.outputs.version }}
      ref: ${{ needs.prepare-version.outputs.bump_commit }}
    secrets: inherit

  publish:
    needs: [prepare-version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare-version.outputs.version }}
      TAG: ${{ needs.prepare-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.bump_commit }}

      - name: Download server .deb installer
        uses: actions/download-artifact@v4
        with:
          name: server-deb
          path: dist/release/${{ env.TAG }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release/publish-github.sh "${VERSION}" \
            --github-repo "${{ github.repository }}" \
            --artifact-dir "dist/release/${TAG}" \
            --no-source-push \
            --no-docker-push \
            --execute

      - name: Bump develop to next dev version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout develop
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f2)
          PATCH=$(echo "${VERSION}" | cut -d. -f3)
          NEXT_DEV_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))-dev"
          sed -i "s/const APP_VERSION = 'v[^']*';/const APP_VERSION = 'v${NEXT_DEV_VERSION}';/" web/static/js/core/config.js
          sed -i "s/const SW_VERSION = 'v[^']*';/const SW_VERSION = 'v${NEXT_DEV_VERSION}';/" web/sw.js
          sed -i "s/<span class=\"version-text\">v[^<]*<\/span>/<span class=\"version-text\">v${NEXT_DEV_VERSION}<\/span>/" web/index.html
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${NEXT_DEV_VERSION}\"/" src-tauri/tauri.conf.json
          sed -i "0,/^version = \"[^\"]*\"/s//version = \"${NEXT_DEV_VERSION}\"/" src-tauri/Cargo.toml
          sed -i "/name = \"nia-todo-desktop\"/{n;s/version = \"[^\"]*\"/version = \"${NEXT_DEV_VERSION}\"/;}" src-tauri/Cargo.lock
          python3 scripts/check_release_versions.py "${NEXT_DEV_VERSION}"
          git add web/manifest.json web/index.html web/sw.js web/static/js/core/config.js \
            src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump develop version to ${NEXT_DEV_VERSION}"
          git push origin develop
