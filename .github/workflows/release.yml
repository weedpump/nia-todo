name: Release

# Triggered by pushing a tag from main, e.g.:
#   git checkout main && git tag v2.7.0 && git push origin v2.7.0
# Orchestrates the shared build.yml workflow instead of duplicating its
# steps - this file only does what's release-specific: bumping the version,
# moving the tag onto the bump commit, building everything, running the test
# suite against the real release .deb, and creating the GitHub release.
#
# Tests run after build (not before, unlike tests.yml's own fast PR/push
# path) because they install and exercise the actual server .deb this
# release ships, native apps and all - not a synthetic test-only package.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump_commit: ${{ steps.bump.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Derive version and switch to main
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag ${TAG} is not a plain vMAJOR.MINOR.PATCH release tag"
            exit 1
          fi
          git checkout main
          if [ "$(git rev-parse main)" != "$(git rev-parse "${TAG}^{commit}")" ]; then
            echo "❌ Tag ${TAG} does not point at the tip of main"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Prepare release version and move tag
        id: bump
        run: |
          scripts/release/prepare-release-version.sh "${{ steps.version.outputs.version }}"
          git tag -f "${{ steps.version.outputs.tag }}" HEAD
          git push origin main
          git push origin "${{ steps.version.outputs.tag }}" --force
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-version
    uses: ./.github/workflows/build.yml
    with:
      build_windows: true
      build_android: true
      build_debian_desktop: true
      build_docker: true
      build_server_deb: true
      version: ${{ needs.prepare-version.outputs.version }}
      ref: ${{ needs.prepare-version.outputs.bump_commit }}
    secrets: inherit

  test:
    needs: [prepare-version, build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.bump_commit }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: pip install -r packaging/requirements.txt httpx

      - name: Install frontend/native toolchain dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Download server .deb installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: nia-todo-server-v*-full.deb*
          merge-multiple: true
          path: dist/release/build

      - name: Install package and run test suite
        env:
          MOBILE_SWIPE_BROWSERS: chromium
        run: scripts/release/install-and-test.sh "dist/release/build/nia-todo-server-v${{ needs.prepare-version.outputs.version }}-full.deb"

  webkit-swipe:
    needs: [prepare-version, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-resolute@sha256:b022639ae9197f864040f92eef7b57c6d4b47db2190f77c909d8a5d902dd4b7e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.bump_commit }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run WebKit mobile swipe regression
        env:
          MOBILE_SWIPE_BROWSERS: webkit
        run: node scripts/test_mobile_swipe_underlay.mjs

  publish:
    needs: [prepare-version, build, test, webkit-swipe]
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.prepare-version.outputs.version }}
      TAG: ${{ needs.prepare-version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.prepare-version.outputs.bump_commit }}

      - name: Download server .deb installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: nia-todo-server-v*-full.deb*
          merge-multiple: true
          path: dist/release/${{ env.TAG }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/release/publish-github.sh "${VERSION}" \
            --github-repo "${{ github.repository }}" \
            --artifact-dir "dist/release/${TAG}" \
            --no-source-push \
            --no-docker-push \
            --execute
